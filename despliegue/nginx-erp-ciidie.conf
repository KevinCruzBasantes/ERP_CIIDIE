# Sitio Nginx del ERP CIIDIE.
# Copiar a /etc/nginx/sites-available/erp-ciidie y habilitar con:
#   ln -s /etc/nginx/sites-available/erp-ciidie /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Escucha en el 8082: verificado contra `ss -tulpn` del servidor el
# 2026-07-07 — el 80 lo usa el sitio actual de Nginx, el 8080 filebrowser,
# el 8081 un servicio Java y el 10000 Webmin.

server {
    listen 8082;
    server_name 10.3.21.120 servidorciidie;

    # Fotos de bitácora y manuales PDF pueden ser pesados
    client_max_body_size 25M;

    location /static/ {
        alias /opt/erp_ciidie/app/staticfiles/;
        expires 7d;
    }

    # NOTA (deuda conocida): /media/ contiene los Excel de reportes y las
    # fotos de bitácora y se sirve SIN autenticación — cualquiera en la red
    # interna con la URL exacta puede descargarlos. Aceptado por ahora
    # (red interna); si se expone el servidor, proteger esta location.
    location /media/ {
        alias /opt/erp_ciidie/app/media/;
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
